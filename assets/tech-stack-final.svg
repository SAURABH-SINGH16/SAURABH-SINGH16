<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" rx="18" fill="#0d0b2b"/>

<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".28"/>
  </filter>
</defs>

<!-- Cards -->
<g fill="#111033" stroke="#a855f7" stroke-width="2" filter="url(#shadow)">
  <rect x="45" y="45" width="630" height="285" rx="20"/>
  <rect x="725" y="45" width="630" height="285" rx="20"/>
  <rect x="45" y="365" width="630" height="285" rx="20"/>
  <rect x="725" y="365" width="630" height="285" rx="20"/>
</g>

<!-- Titles -->
<g fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="middle">
  <text x="360" y="105">🌐 Frontend</text>
  <text x="1040" y="105">☕ Backend</text>
  <text x="360" y="425">🗄️ Database</text>
  <text x="1040" y="425">🧰 Tools</text>
</g>

<!-- Pill helper styling -->
<g fill="#2b2b3b" stroke="#66667a" stroke-width="1.2">
  <!-- Frontend -->
  <rect x="70" y="145" width="170" height="58" rx="11"/>
  <rect x="255" y="145" width="170" height="58" rx="11"/>
  <rect x="440" y="145" width="190" height="58" rx="11"/>
  <rect x="145" y="220" width="200" height="58" rx="11"/>
  <rect x="365" y="220" width="200" height="58" rx="11"/>

  <!-- Backend -->
  <rect x="750" y="145" width="175" height="58" rx="11"/>
  <rect x="940" y="145" width="190" height="58" rx="11"/>
  <rect x="1145" y="145" width="185" height="58" rx="11"/>
  <rect x="850" y="220" width="200" height="58" rx="11"/>
  <rect x="1070" y="220" width="200" height="58" rx="11"/>

  <!-- Database -->
  <rect x="70" y="465" width="170" height="58" rx="11"/>
  <rect x="255" y="465" width="170" height="58" rx="11"/>
  <rect x="440" y="465" width="190" height="58" rx="11"/>
  <rect x="215" y="540" width="290" height="58" rx="11"/>

  <!-- Tools -->
  <rect x="850" y="465" width="210" height="58" rx="11"/>
  <rect x="1080" y="465" width="210" height="58" rx="11"/>
