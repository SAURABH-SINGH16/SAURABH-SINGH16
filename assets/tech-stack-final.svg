  <circle cx="101" cy="174" r="18" fill="#e34f26"/><text x="101" y="174" font-size="13" fill="white">5</text>
  <circle cx="286" cy="174" r="18" fill="#1572b6"/><text x="286" y="174" font-size="13" fill="white">3</text>
  <rect x="452" y="156" width="36" height="36" rx="6" fill="#f7df1e"/><text x="470" y="174" font-size="18" fill="#111">JS</text>
  <text x="185" y="174" font-size="25" fill="#61dafb">⚛</text>
  <text x="405" y="174" font-size="29" fill="#06b6d4">≋</text>

  <!-- Backend -->
  <text x="775" y="174" font-size="25" fill="#ed8b00">☕</text>
  <circle cx="965" cy="174" r="18" fill="#6db33f"/><text x="965" y="174" font-size="18" fill="white">S</text>
  <circle cx="1170" cy="174" r="18" fill="#c71a36"/><text x="1170" y="174" font-size="15" fill="white">M</text>
  <circle cx="875" cy="249" r="18" fill="#59666c"/><text x="875" y="249" font-size="12" fill="white">H</text>
  <circle cx="1095" cy="249" r="18" fill="#2563eb"/><text x="1095" y="249" font-size="11" fill="white">API</text>

  <!-- Database -->
  <circle cx="101" cy="494" r="18" fill="#4479a1"/><text x="101" y="494" font-size="12" fill="white">SQL</text>
  <circle cx="286" cy="494" r="18" fill="#47a248"/><text x="286" y="494" font-size="16" fill="white">M</text>
  <circle cx="470" cy="494" r="18" fill="#4169e1"/><text x="470" y="494" font-size="12" fill="white">PG</text>
  <circle cx="245" cy="569" r="18" fill="#003b57"/><text x="245" y="569" font-size="12" fill="white">DB</text>

  <!-- Tools -->
  <circle cx="881" cy="494" r="18" fill="#007acc"/><text x="881" y="494" font-size="13" fill="white">VS</text>
  <circle cx="1111" cy="494" r="18" fill="#ff6c37"/><text x="1111" y="494" font-size="13" fill="white">P</text>
