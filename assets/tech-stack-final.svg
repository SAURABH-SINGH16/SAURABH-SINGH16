<!-- Small footer accent -->
<text x="700" y="705" text-anchor="middle" fill="#a855f7"
      font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600">
  Java • Spring Boot • REST APIs • Cloud • Databases
</text>
</svg>