  <text x="310" y="181">CSS3</text>
  <text x="495" y="181">JavaScript</text>
  <text x="215" y="181">React</text>
  <text x="435" y="181">Tailwind CSS</text>

  <text x="810" y="181">Java</text>
  <text x="1000" y="181">Spring Boot</text>
  <text x="1205" y="181">Maven</text>
  <text x="920" y="256">Hibernate</text>
  <text x="1140" y="256">REST API • JDBC • JPA</text>

  <text x="130" y="501">MySQL</text>
  <text x="315" y="501">MongoDB</text>
  <text x="500" y="501">PostgreSQL</text>
  <text x="280" y="576">SQLite</text>

  <text x="915" y="501">VS Code</text>
  <text x="1145" y="501">Postman</text>
